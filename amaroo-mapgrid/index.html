<!doctype html>
<html class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>Ready to Rank — Protected</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --accent: #17B4F0;        /* R2R brand blue */
        --accent-hover: #39A0FE;  /* R2R azure */
        --bg: #0F0F12;            /* R2R near-black canvas */
        --card: #17171C;          /* raised dark panel */
        --text: #FFFFFF;
        --text-muted: #8A8A95;
        --border: #2A2A32;
        --input-bg: #1F1F26;
        --font: 'Archivo', Arial, Helvetica, sans-serif;
        --mono: 'Space Mono', 'Courier New', monospace;
      }
      html, body { height: 100%; }
      body { background-color: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
      .staticrypt-spinner-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 10; }
      .staticrypt-spinner { width: 2rem; height: 2rem; border: 3px solid var(--border); border-right-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .staticrypt-content { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; gap: 40px; }
      .logo { display: flex; flex-direction: column; align-items: center; gap: 14px; user-select: none; }
      .logo-img { height: 34px; width: auto; display: block; }
      .logo-tag { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text-muted); }
      .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 40px; display: flex; flex-direction: column; gap: 28px; }
      .card-header { text-align: center; display: flex; flex-direction: column; gap: 10px; }
      .card-label { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); }
      .card-subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
      #staticrypt-form { display: flex; flex-direction: column; gap: 16px; }
      .staticrypt-password-container { position: relative; }
      #staticrypt-password { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--font); font-size: 15px; padding: 13px 44px 13px 16px; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
      #staticrypt-password::placeholder { color: var(--text-muted); opacity: 0.7; }
      #staticrypt-password:focus { border-color: var(--accent); background: #23232B; }
      .staticrypt-toggle-password-visibility { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; opacity: 0.4; cursor: pointer; transition: opacity 0.15s; }
      .staticrypt-toggle-password-visibility:hover { opacity: 0.85; }
      .staticrypt-decrypt-button { width: 100%; background: var(--accent); color: #0F0F12; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: none; border-radius: 40px; padding: 15px 24px; cursor: pointer; transition: background 0.15s; -webkit-appearance: none; }
      .staticrypt-decrypt-button:hover { background: var(--accent-hover); }
      .staticrypt-decrypt-button:active { transform: scale(0.99); }
      label.staticrypt-remember { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .staticrypt-remember input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 2px; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; transition: border-color 0.15s, background 0.15s; }
      .staticrypt-remember input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
      .staticrypt-remember input[type="checkbox"]:checked::after { content: ""; position: absolute; top: 1px; left: 4px; width: 4px; height: 7px; border: 2px solid #0F0F12; border-top: none; border-left: none; transform: rotate(45deg); }
      .remember-label { font-size: 12px; color: var(--text-muted); letter-spacing: 0.03em; }
      .footer { font-family: var(--mono); font-size: 10px; color: var(--text-muted); opacity: 0.7; letter-spacing: 0.16em; text-transform: uppercase; }
      .hidden { display: none !important; }
    </style>
  </head>
