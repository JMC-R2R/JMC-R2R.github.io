<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Marketing Dashboard · Ready to Rank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="social.css">
<style>
/* CLIENT-FACING marketing dashboard, built to the Cobalt framework spec
   (my-client-cobalt-constructions/working/cobalt-dashboard-framework.md).
   Same tokens, same layout rhythm: eyebrow -> KPI row -> callout -> charts -> tables.
   Services the client has not bought are shown LOCKED, never hidden, so they can see
   what else exists. Contains figures only: no checklist, owners, jobs or fees. */
:root{
  --ground:#0F0F12; --s1:#141419; --s2:#1B1B21; --s3:#212129;
  --bd:#2A2A32; --bd2:#33333d;
  --ink:#FFFFFF; --ink2:#B4B4BE; --ink3:#7A7A86;
  --r2r:#17B4F0; --client:#17B4F0;
  --good:#10B981; --warn:#F59E0B; --bad:#EF4444;
  /* chart series, validated for this dark surface with the dataviz validator */
  --c1:#1F8FC4; --c2:#C2628F; --c3:#96802F; --c4:#6F7BD6; --c5:#3F9E7C;
  --sans:'Archivo',system-ui,-apple-system,sans-serif; --head:var(--sans); --mono:'Space Mono',ui-monospace,monospace;
  --maxw:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--client)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.h2,.clogo,.kpi .val{font-family:var(--head)}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* gate */
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(130% 130% at 50% 0%,#16161c,var(--ground))}
.gatecard{width:100%;max-width:400px;background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:32px 30px;display:flex;flex-direction:column;gap:16px}
.gatelogos{display:flex;align-items:center;gap:12px;justify-content:center}
.gatelogos img{height:22px;width:auto}
.gatelogos .x{color:var(--ink3);font-size:12px}
.gatecard h1{font-size:17px;text-align:center}
.gatecard p{font-size:12.5px;color:var(--ink3);text-align:center;margin:-6px 0 2px}
label.l{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
input{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--ink);font-family:var(--sans);font-size:15px;padding:12px 14px;outline:none}
input:focus{border-color:var(--client)}
button{font-family:var(--sans);font-weight:800;cursor:pointer;border:none;border-radius:40px;padding:13px;font-size:14px;background:var(--client);color:#03242e}
button:disabled{opacity:.6;cursor:default}
.btn-s{border-radius:8px;padding:11px 14px;min-height:40px;font-size:12px;font-weight:700;background:transparent;border:1px solid var(--bd);color:var(--ink2)}
.gateerr{color:var(--bad);font-size:12.5px;text-align:center;min-height:16px}

#app{display:none}
header{position:sticky;top:0;z-index:30;background:rgba(15,15,18,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hrow{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.brandrow img.r2r{height:19px;width:auto}
.brandrow img.clientlogo{height:26px;width:auto;max-width:210px;object-fit:contain;object-position:left}
.brandrow .div{width:1px;height:20px;background:var(--bd2);flex:none}
.clogo{font-weight:900;font-size:17px;letter-spacing:-.01em;color:var(--client);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.brandrow img.clientlogo{height:17px;max-width:140px}.clogo{font-size:14px}.brandrow{gap:9px}}
.htitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.hright{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink3)}
.team{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.team .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.team img{height:17px;width:auto;opacity:.92}
.team .p{font-size:12px;color:var(--ink2)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);position:sticky;top:57px;background:rgba(15,15,18,.94);backdrop-filter:blur(10px);z-index:29}
.tab{background:none;border:none;border-radius:0;color:var(--ink3);padding:12px 14px;font-size:13.5px;font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab[aria-selected=true]{color:var(--client);border-bottom-color:var(--client)}
.tab.locked{color:#5a5a64}
.tab.locked .lk{font-size:11px;opacity:.8}
.monthbar{display:flex;gap:7px;padding:12px 0;overflow-x:auto}
.mchip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:30px;border:1px solid var(--bd);background:var(--s1);color:var(--ink2);cursor:pointer}
.mchip[aria-pressed=true]{background:var(--client);border-color:var(--client);color:#03242e;font-weight:700}
main{padding-bottom:90px}
section[hidden]{display:none}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:22px 0 8px}
.h2{font-size:19px;margin:26px 0 4px}
.sub{color:var(--ink3);font-size:13px;max-width:64ch;margin:0 0 14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.card+.kpis{margin-top:14px}
.kpi{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:7px;min-height:104px}
.kpi .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .val.na{font-size:20px;color:var(--ink3);font-weight:700}
.kpi .foot{font-size:11.5px;color:var(--ink3);margin-top:auto}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px}
.chip.up{color:var(--good);background:rgba(16,185,129,.12)} .chip.dn{color:var(--bad);background:rgba(239,68,68,.12)}
.chip.flat{color:var(--ink3);background:rgba(122,122,134,.14)}
.callout{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:14px 16px 14px 18px;position:relative;overflow:hidden;margin:16px 0 0}
.callout .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--client)}
.callout.good .bar{background:var(--good)} .callout.warn .bar{background:var(--warn)} .callout.bad .bar{background:var(--bad)}
.callout h4{margin:0 0 5px;font-size:14px;font-weight:800;display:flex;gap:9px;align-items:center}
.sig{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:5px;color:var(--ink3);background:rgba(122,122,134,.14)}
.callout p{margin:0;font-size:13.5px;color:var(--ink2)}
.grid.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:820px){.grid.g2{grid-template-columns:1fr}}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:14px}
.cardhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.cardhead h3{font-size:14.5px}
.ch3sub{font-size:12px;color:var(--ink3);margin:2px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 13px;font-size:11.5px;color:var(--ink2);min-width:0;max-width:100%}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:baseline}
.tbl tr.total td{border-bottom:none;border-top:1px solid var(--bd2);color:var(--ink);font-weight:800}
.tbl tr.total td:first-child{font-weight:800}
.chart{position:relative}
.chart svg{width:100%;height:230px;display:block;overflow:visible}
.gridline{stroke:var(--bd);stroke-width:1}
.axtxt{fill:var(--ink3);font-size:10px;font-family:var(--mono)}
.tip{position:absolute;top:6px;background:var(--s3);border:1px solid var(--bd2);border-radius:9px;padding:8px 10px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;min-width:130px}
.tip .td{color:var(--ink3);font-size:11px;margin-bottom:5px}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tscroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:9px 10px;border-bottom:1px solid var(--bd);font-weight:700}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--bd);color:var(--ink2)}
.tbl td b{color:var(--ink)}
.tbl td.tnum,.tbl th.tnum{text-align:right}
.momgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:12px}
.momcard{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:14px 15px}
.momcard .lab{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.momcard .big{font-size:21px;font-weight:800;margin:6px 0 2px;display:flex;gap:8px;align-items:baseline}
.momcard .cap{font-size:11.5px;color:var(--ink3)}
.mspark{width:100%;height:40px;display:block;margin-top:8px}
.empty-note{color:var(--ink3);font-size:13px;text-align:center;padding:54px 10px}

/* dummy-data sticker */
.sticker{position:sticky;top:96px;z-index:28;margin:14px 0 0;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);border-radius:12px;padding:12px 15px;display:flex;gap:12px;align-items:flex-start}
.sticker .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#03242e;background:var(--warn);padding:4px 9px;border-radius:6px;font-weight:700;white-space:nowrap}
.sticker p{margin:0;font-size:13px;color:var(--ink2)}
.dummy .kpi,.dummy .card,.dummy .momcard{position:relative}
.dummy .kpi::after{content:'SAMPLE';position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--warn);opacity:.75}

/* locked service dialog */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:none;place-items:center;padding:24px}
.modal.on{display:grid}
.mcard{width:100%;max-width:440px;background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:26px}
.mcard h3{font-size:17px;margin-bottom:8px}
.mcard p{font-size:13.5px;color:var(--ink2);margin:0 0 18px}
.mrow{display:flex;gap:10px;justify-content:flex-end}

/* Ask panel: available on every tab, so a client never has to hunt for the answer */
#askBtn{position:fixed;right:20px;bottom:20px;z-index:40;border-radius:40px;padding:9px 18px 9px 10px;font-size:14px;
  background:var(--client);color:#03242e;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:center;gap:9px}
#askBtn .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
#askPanel{position:fixed;right:20px;bottom:20px;z-index:41;width:min(420px,calc(100vw - 32px));max-height:min(660px,calc(100vh - 40px));
  background:var(--s2);border:1px solid var(--bd);border-radius:16px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#askPanel.on{display:flex}
.askhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.askhead .t{font-weight:800;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:var(--s3);border:1px solid var(--bd2);display:block}
.av.sm{width:22px;height:22px;border-radius:50%}
.avmono{display:grid;place-items:center;font-family:var(--sans);font-weight:900;color:#03242e;background:linear-gradient(145deg,var(--r2r),#0e86b8);border:none;letter-spacing:-.02em}
.av.avmono{font-size:13px} .av.sm.avmono{font-size:8.5px}
.avwrap{position:relative;flex:none;display:block}
.aibadge{position:absolute;right:-3px;bottom:-3px;font-family:var(--mono);font-size:8px;font-weight:700;
  letter-spacing:.06em;background:var(--r2r);color:#03242e;border-radius:20px;padding:2px 5px;
  border:2px solid var(--s2);line-height:1}
#askBtn .aibadge{border-color:var(--client)}
.msg.ai{display:flex;gap:9px;align-items:flex-start}
.msg.ai .bubble{flex:1;min-width:0}
.askhead .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.askhead .role{font-size:11.5px;color:var(--ink2);margin-top:1px}
.askhead button{margin-left:auto;background:none;border:none;color:var(--ink3);font-size:20px;padding:0 4px;border-radius:6px}
.askbody{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:170px}
.msg{font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--s3);border:1px solid var(--bd);border-radius:12px 12px 4px 12px;padding:9px 12px;max-width:85%;color:var(--ink)}
.msg.ai{color:var(--ink2)}
.msg.ai .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--client);display:block;margin-bottom:5px}
.askhead .sub2{font-size:11px;color:var(--ink3)}
.asksug{display:flex;flex-wrap:wrap;gap:7px}
.asksug button{background:var(--s1);border:1px solid var(--bd);color:var(--ink2);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;text-align:left}
.askfoot{border-top:1px solid var(--bd);padding:12px 14px;display:flex;gap:9px;align-items:center}
.askfoot input{flex:1;padding:10px 12px;font-size:14px}
.askfoot button{border-radius:10px;padding:10px 15px;font-size:13px}
.asknote{font-size:11px;color:var(--ink3);padding:0 16px 12px}
.handoff{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 10px}
.handoff button{background:var(--s1);border:1px solid var(--bd);color:var(--ink2);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700}
.handoff button:disabled{opacity:.55}
.handoff .ok{font-size:12px;color:var(--good)}
.msg.sys{align-self:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--good);background:rgba(16,185,129,.1);border-radius:20px;padding:5px 11px}
@media (max-width:520px){#askPanel{right:8px;left:8px;bottom:8px;width:auto;max-height:calc(100vh - 16px)}#askBtn{right:14px;bottom:14px}}
/* Phone: the header is sticky, so every pixel it takes is a pixel of report the
   client never sees. Compress it rather than letting it eat a third of the screen. */
@media (max-width:560px){
  .hrow{padding:10px 0;gap:10px}
  .htitle{display:none}
  .hright{font-size:11px;gap:8px}
  .hright #whoami{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team{padding:7px 0;gap:9px}
  .team .lbl{font-size:8.5px}
  .team img{height:14px}
  .team .p{font-size:11px}
  nav.tabs{top:50px}
  .tab{padding:11px 11px;font-size:13px}
  .monthbar{padding:9px 0}
  .wrap{padding:0 16px}
  .eyebrow{margin:16px 0 6px}
  .h2{font-size:17px;margin:20px 0 4px}
  .kpi{min-height:92px;padding:13px 14px}
  .kpi .val{font-size:23px}
  .scrollhint{display:block}
}
.scrollhint{display:none;font-size:11px;color:var(--ink3);margin-top:8px}
footer{border-top:1px solid var(--bd);margin-top:40px;padding:18px 0 46px;color:var(--ink3);font-size:11.5px}
footer .flogos{display:flex;gap:12px;align-items:center;margin-bottom:8px}
footer img{height:15px;opacity:.75}
</style>
</head>
<body>

<div id="gate">
  <form class="gatecard" id="gateform">
    <div class="gatelogos"><img src="/operations/assets/r2r-logo.png" alt="Ready to Rank"></div>
    <h1>Marketing Dashboard</h1>
    <p>Sign in with your email. We send a link and a code, so there is no password to remember.</p>
    <div id="step1">
      <div><label class="l" for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@company.com"/></div>
      <button type="submit" id="sendBtn" style="width:100%;margin-top:14px">Email me a sign-in link</button>
    </div>
    <div id="step2" style="display:none">
      <div><label class="l" for="code">Code from the email</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10"/></div>
      <button type="submit" id="verifyBtn" style="width:100%;margin-top:14px">Sign in</button>
      <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px">
        <a href="#" id="resend">Send a new email</a><a href="#" id="restart">Use a different email</a>
      </div>
    </div>
    <div class="gateerr" id="gateerr"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="wrap">
      <div class="hrow">
        <span class="brandrow">
          <img class="r2r" src="/operations/assets/r2r-logo.png" alt="Ready to Rank">
          <span class="div"></span>
          <span id="cbrand"></span>
        </span>
        <span class="htitle">Marketing Dashboard</span>
        <div class="hright"><span id="whoami"></span><button class="btn-s" id="out">Sign out</button></div>
      </div>
      <div class="team"><span class="lbl">Delivered by</span><img src="/operations/assets/r2r-logo.png" alt="Ready to Rank"><span class="p" id="partners"></span></div>
    </div>
    <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
    <div class="wrap"><div class="monthbar" id="months"></div></div>
  </header>

  <main class="wrap">
    <div id="sticker"></div>
    <section id="sec-overview"></section>
    <section id="sec-meta" hidden></section>
    <section id="sec-google" hidden></section>
    <section id="sec-seo" hidden></section>
    <section id="sec-social" hidden></section>
    <section id="sec-ai" hidden></section>
    <section id="sec-updates" hidden></section>
    <footer>
      <div class="flogos"><img src="/operations/assets/r2r-logo.png" alt="Ready to Rank"></div>
      <div id="sources"></div>
    </footer>
  </main>
</div>


<button id="askBtn" style="display:none"><span id="askBtnAvatar"></span>Ask Jarvis <span class="k">AI</span></button>
<div id="askPanel">
  <div class="askhead"><span id="askAvatar"></span><div><div class="t">Jarvis Chavez</div><div class="role">Jose's AI assistant</div><div class="s" id="askAsAt"></div></div><button id="askClose" aria-label="Close">&times;</button></div>
  <div class="askbody" id="askBody"></div>
  <div class="asknote" id="askNote"></div>
  <div class="handoff" id="askHandoff">
    <button type="button" id="toJose">Send this to Jose</button>
    <button type="button" id="showFaq">View FAQs</button>
    <span class="ok" id="handoffOk"></span>
  </div>
  <form class="askfoot" id="askForm"><input id="askInput" placeholder="Ask Jarvis anything about your ads" autocomplete="off" maxlength="600"/><button type="submit" id="askSend">Ask</button></form>
</div>

<div class="modal" id="lockModal"><div class="mcard">
  <h3 id="lockTitle"></h3>
  <p id="lockBody"></p>
  <div class="mrow"><button class="btn-s" id="lockClose">Close</button><button id="lockAsk">Ask Jose about it</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

const SB_URL="https://tjgrtrazyepvbcmmdhet.supabase.co";

/* ---------- dummy data: clearly marked, never mistaken for real ---------- */
function fillDummy(){
  const end=new Date(); const days=[];
  for(let i=29;i>=0;i--){ const d=new Date(end); d.setDate(end.getDate()-i);
    const w=d.getDay(); const base=44+((i*13)%7)*3.4;
    days.push({day:d.toISOString().slice(0,10),spend:Math.round((w===0||w===6?base*0.72:base)*100)/100,
               leads:(i*5)%4, purchases:(i%7===0)?1:0}); }
  const sum=k=>days.reduce((s,d)=>s+Number(d[k]||0),0);
  D.daily=days;
  D.totals={spend:Math.round(sum('spend')),clicks:1180,impressions:64200,leads:sum('leads'),purchases:sum('purchases'),revenue:sum('purchases')*1850};
  D.prev={spend:Math.round(sum('spend')*0.82),leads:Math.round(sum('leads')*0.75),purchases:Math.max(1,sum('purchases')-2),revenue:(Math.max(1,sum('purchases')-2))*1850};
  D.last7={spend:Math.round(days.slice(-7).reduce((s,d)=>s+d.spend,0)),leads:days.slice(-7).reduce((s,d)=>s+d.leads,0),purchases:days.slice(-7).reduce((s,d)=>s+d.purchases,0)};
  const camps=(D.campaigns||[]).length?D.campaigns:[{name:'Campaign 1'},{name:'Campaign 2'}];
  const share=camps.map((c,i)=>i===0?0.62:(0.38/Math.max(1,camps.length-1)));
  D.by_campaign=camps.map((c,i)=>({campaign:c.name,platform:c.platform||'meta',
      spend:Math.round(D.totals.spend*share[i]),clicks:Math.round(1180*share[i]),
      impressions:Math.round(64200*share[i]),
      leads:i===0?0:D.totals.leads,purchases:i===0?D.totals.purchases:0,revenue:i===0?D.totals.revenue:0}));
  D.daily_by_campaign=[];
  days.forEach((d,n)=>camps.forEach((c,i)=>D.daily_by_campaign.push(
      {day:d.day,campaign:c.name,spend:Math.round(d.spend*share[i]*((n+i)%5===0?1.25:0.95)*100)/100})));
  D.actions=[{on:days[days.length-6].day,what:'Sample: paused the weakest ad set',why:'Sample entry so you can see how changes are reported'}];
  if(SHOP()){                       // a store's sample shows the shopping funnel too
    days.forEach((d,i)=>{ d.add_to_carts=(i*3)%4; });
    Object.assign(D.totals,{link_clicks:940,landing_page_views:860,add_to_carts:sum('add_to_carts'),checkouts:4,messages:6});
    Object.assign(D.prev,{add_to_carts:Math.round(sum('add_to_carts')*0.7),messages:4});
    D.by_campaign.forEach((c,i)=>Object.assign(c,{link_clicks:Math.round(940*share[i]),landing_page_views:Math.round(860*share[i]),
      add_to_carts:Math.round(D.totals.add_to_carts*share[i]),checkouts:i===0?4:0,messages:i===0?4:2}));
  }
  D.launch_totals=D.totals; D.by_campaign_launch=D.by_campaign; D.days_this_month=30;
}

/* The R2R frame never changes: same layout, same rhythm, same components, same mono
   micro-labels. Only the SKIN moves, taken from the client's own site, so the page reads
   as theirs the moment they open it. Contrast is checked before a theme is stored. */
const THEME_KEYS=['ground','s1','s2','s3','bd','bd2','ink','ink2','ink3'];
function applyTheme(theme, accent){
  const root=document.documentElement;
  if(accent) root.style.setProperty('--client', accent);
  if(!theme) return;
  THEME_KEYS.forEach(k=>{ if(theme[k]) root.style.setProperty('--'+k, theme[k]); });
  if(theme.font_heading){
    const fam=theme.font_heading;
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(fam).replace(/%20/g,'+')+':wght@600;700;800&display=swap';
    l.onload=()=>root.style.setProperty('--head',`'${fam}', var(--sans)`);
    document.head.appendChild(l);                 // if it never loads, Archivo stays
  }
}

/* Client logo: svg first because it stays sharp at any size, then png, then the
   client's name in their own accent colour so the header is never blank. */
function setClientBrand(slug, name){
  const box=$('cbrand');
  const fallback=()=>{ box.innerHTML=`<span class="clogo">${esc(name.toUpperCase())}</span>`; };
  const tryOne=exts=>{
    if(!exts.length) return fallback();
    const ext=exts[0], img=new Image();
    img.onload=()=>{ box.innerHTML=`<img class="clientlogo" src="logos/${encodeURIComponent(slug)}.${ext}" alt="${esc(name)}">`; };
    img.onerror=()=>tryOne(exts.slice(1));
    img.src=`logos/${encodeURIComponent(slug)}.${ext}`;
  };
  fallback(); tryOne(['svg','png']);
}

/* ---------- tabs, months ---------- */
function bought(key){
  if(!key) return true;
  const s=(D.services||[]).map(x=>String(x).toLowerCase()).join(' ')+' '+String(D.platform||'').toLowerCase();
  if(key==='meta') return /meta|facebook|instagram/.test(s);
  if(key==='google') return /google ads|google|adwords|ppc/.test(s);
  if(key==='seo') return /seo|local|gbp/.test(s);
  if(key==='social') return /social/.test(s)||hasSocial();   // unlocked once their own social figures exist
  if(key==='ai') return /ai|geo/.test(s);
  return false;
}
function renderTabs(){
  $('tabs').innerHTML=TABS.map(([k,label,svc])=>{
    const on=bought(svc);
    return `<button class="tab ${on?'':'locked'}" role="tab" aria-selected="${k===TAB}" data-tab="${k}" data-on="${on}">${esc(label)}${on?'':'<span class="lk">🔒</span>'}</button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.on==='false'){ openLock(b.dataset.tab); return; }
    TAB=b.dataset.tab; renderTabs(); showTab(); renderAll();

function showTab(){ TABS.forEach(([k])=>{ const s=$('sec-'+k); if(s) s.hidden = k!==TAB; });

function renderMonths(){

  $('months').innerHTML=chips.map(([k,l])=>`<button class="mchip" aria-pressed="${k===VIEW}" data-v="${k}">${esc(l)}</button>`).join('');
  document.querySelectorAll('.mchip').forEach(b=>b.addEventListener('click',()=>{VIEW=b.dataset.v;renderMonths();renderAll();}));

function kpi(lab,val,foot){ return `<div class="kpi"><div class="lab">${esc(lab)}</div><div class="val">${val}</div><div class="foot">${foot||''}</div></div>`; }
function delta(now,then){
  if(!has(then)||!has(now)) return '';
  const d=Math.round((Number(now)-Number(then))/Number(then)*100);
  return `<span class="chip ${d>0?'up':d<0?'dn':'flat'}">${d>=0?'+':''}${d}%</span> on last month`;
}

function callout(){
  const {t,label}=P(), tgt=D.target;
  if(DUMMY) return `<div class="callout warn"><span class="bar"></span><h4>Sample view <span class="sig">Dummy data</span></h4>
    <p>This is what your dashboard looks like with a month of campaigns behind it. Your own numbers replace it once the ads have been running.</p></div>`;
  if(!has(t.spend)) return `<div class="callout"><span class="bar"></span><h4>Not started <span class="sig">Waiting</span></h4>
    <p>Your campaigns have not started spending. Nothing is estimated here, so every figure reads N/A until they do.</p></div>`;
  if(SHOP()){
    /* A short read for the owner, built only from the figures on this page. Every
       sentence is conditional on its number existing, so nothing here is estimated. */
    const pl=(n,one,many)=>`${num(n)} ${Number(n)==1?one:many}`;
    const when=VIEW==='launch'&&D.launch_date
      ?`Since your ads started on ${new Date(D.launch_date+'T00:00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit'})}`
      :`So far in ${new Date(D.month+'T00:00:00').toLocaleDateString('en-AU',{month:'long'})}`;
    const s=[];
    s.push(t.landing_page_views!=null
      ?`${when}, we have spent ${aud(t.spend)} and brought ${pl(t.landing_page_views,'person','people')} to your website.`
      :`${when}, we have spent ${aud(t.spend)} on your ads.`);
    if(t.add_to_carts!=null){
      if(has(t.add_to_carts)) s.push(`${pl(t.add_to_carts,'visitor','visitors')} added a piece to their cart, at ${cost(t.spend/t.add_to_carts)} of ad spend each`
        +(has(t.checkouts)?`, and ${pl(t.checkouts,'went','went')} on to start checkout.`:'.'));
      else s.push('Nobody has added to cart yet.');
    }
    if(has(t.purchases)) s.push(`${pl(t.purchases,'online sale','online sales')} came through`
      +(has(t.revenue)?` worth ${aud(t.revenue)}, a return of ${(Number(t.revenue)/Number(t.spend)).toFixed(1)}x on ad spend.`:'.'));
    else s.push('No online sales have come through yet. Higher value pieces are a considered purchase, so add to carts and checkouts are the early signs we watch while sales build.');
    const talk=[];
    if(has(t.messages)) talk.push(`${pl(t.messages,'person','people')} messaged you directly from the ads`);
    if(has(t.leads)) talk.push(`${pl(t.leads,'enquiry','enquiries')} came through the form`);
    if(talk.length) s.push(talk.join(' and ')+'.');
    return `<div class="callout"><span class="bar"></span><h4>Your ads at a glance <span class="sig">${esc(label)}</span></h4>
      <p>${esc(s.join(' '))}</p></div>`;
  }
  const cpl=has(t.leads)?Number(t.spend)/Number(t.leads):null;
  if(tgt&&tgt.value&&cpl){
    const good=cpl<=Number(tgt.value);
    return `<div class="callout ${good?'good':'warn'}"><span class="bar"></span><h4>${good?'On target':'Above target'} <span class="sig">${good?'Good':'Watch'}</span></h4>
      <p>${num(t.leads)} ${t.leads==1?'enquiry':'enquiries'} for ${aud(t.spend)}, which is ${aud(cpl)} each against a target of ${aud(tgt.value)}.</p></div>`;
  }
  return `<div class="callout"><span class="bar"></span><h4>${esc(label)} <span class="sig">Update</span></h4>
    <p>${aud(t.spend)} spent, ${num(t.leads)} ${t.leads==1?'enquiry':'enquiries'} and ${num(t.purchases)} ${t.purchases==1?'purchase':'purchases'}.</p></div>`;
}
function kpiRow(){
  const {t,label}=P(),p=D.prev||{},l7=D.last7||{},tgt=D.target;
  const live=has(t.spend);
  /* Month on month only makes sense when the tile is showing a month. */
  const dl=(a,b)=>VIEW==='month'&&!(Number(D.days_this_month)<7)?delta(a,b):'';
  const v=(n)=>{ const s=cnt(n,live); return s==='N/A'?NAV:s; };
  const c=(n)=>{ const s=per(t.spend,n,live); return s==='N/A'?NAV:s; };
  const roas=live&&has(t.revenue)?(Number(t.revenue)/Number(t.spend)).toFixed(1)+'x':'—';
  const foot=(a,b)=>dl(a,b)||(live?label.toLowerCase():'not started');
  const spendTile=kpi('Spend',live?aud(t.spend):NAV,foot(t.spend,p.spend));
  const dmTile=t.messages!=null?kpi('DMs from ads',v(t.messages),foot(t.messages,p.messages)):'';
  if(SHOP()) return `<div class="kpis">
    ${spendTile}
    ${kpi('Add to carts',v(t.add_to_carts),foot(t.add_to_carts,p.add_to_carts))}
    ${kpi('Cost per add to cart',c(t.add_to_carts),t.checkouts!=null&&live?`${num(t.checkouts)} ${t.checkouts==1?'checkout':'checkouts'} started`:'')}
    ${kpi('Purchases',v(t.purchases),foot(t.purchases,p.purchases))}
    ${kpi('Revenue',live?aud(t.revenue):NAV,'Return on ad spend '+roas)}
    ${dmTile}
  </div>`;
  return `<div class="kpis">
    ${spendTile}
    ${kpi('Enquiries',v(t.leads),foot(t.leads,p.leads))}
    ${kpi('Cost per enquiry',c(t.leads),tgt&&tgt.value?('Target '+aud(tgt.value)):'')}
    ${kpi('Purchases',v(t.purchases),foot(t.purchases,p.purchases))}
    ${kpi('Revenue',live?aud(t.revenue):NAV,'Return on ad spend '+roas)}
    ${dmTile||kpi('Last 7 days',has(l7.spend)?aud(l7.spend):NAV,has(l7.spend)?`${num(l7.leads)} ${l7.leads==1?'enquiry':'enquiries'}, ${num(l7.purchases)} ${l7.purchases==1?'purchase':'purchases'}`:'nothing yet')}
  </div>`;
}
function campSeries(){
  const names=[...new Set([...(D.by_campaign||[]).map(c=>c.campaign),
                           ...(D.daily_by_campaign||[]).map(r=>r.campaign),
                           ...(D.campaigns||[]).map(c=>c.name)].filter(Boolean))];
  const ramp=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
  const m={}; names.forEach((n,i)=>m[n]= i<5?ramp[i]:'var(--ink3)');
  return {names,colour:m};
}
function dash(v){ return has(v)?null:'—'; }
/* The bird's eye table. Columns follow what the client sells: the shopping funnel for a
   store, enquiries for everyone else. A column the pull has never collected for this
   client is left off rather than shown as a row of N/As. */
function tableCols(camps){
  const got=k=>camps.some(c=>c[k]!=null);
  const cols=[['spend','Spend',c=>aud(c.spend)]];
  if(SHOP()){
    if(got('link_clicks')) cols.push(['link_clicks','Link clicks',c=>cnt(c.link_clicks,has(c.spend))]);
    else cols.push(['clicks','Clicks',c=>num(c.clicks)]);
    if(got('landing_page_views')) cols.push(['landing_page_views','Landing page views',c=>cnt(c.landing_page_views,has(c.spend))]);
    if(got('add_to_carts')){ cols.push(['add_to_carts','Add to carts',c=>cnt(c.add_to_carts,has(c.spend))]);
      cols.push(['cpatc','Cost per add to cart',c=>per(c.spend,c.add_to_carts,has(c.spend))]); }
    if(got('checkouts')) cols.push(['checkouts','Checkouts',c=>cnt(c.checkouts,has(c.spend))]);
    cols.push(['purchases','Purchases',c=>num(c.purchases)]);
    if(got('messages')) cols.push(['messages','DMs',c=>cnt(c.messages,has(c.spend))]);
    cols.push(['leads','Enquiries',c=>num(c.leads)]);
  }else{
    cols.unshift(['impressions','Impressions',c=>num(c.impressions)],['clicks','Clicks',c=>num(c.clicks)]);
    cols.push(['cpc','Cost per click',c=>per(c.spend,c.clicks,has(c.spend))]);
    cols.push(['leads','Enquiries',c=>num(c.leads)]);
    cols.push(['cpl','Cost per enquiry',c=>per(c.spend,c.leads,has(c.spend))]);
    if(got('messages')) cols.push(['messages','DMs',c=>cnt(c.messages,has(c.spend))]);
  }
  return cols;
}
function campaignTable(){
  const {colour}=campSeries();
  const {camps,label}=P();
  const live=camps.length;
  const cols=tableCols(camps);
  const rows=live?camps.map(c=>`<tr><td><i class="dot" style="background:${colour[c.campaign]||'var(--ink3)'}"></i><b>${esc(c.campaign)}</b></td>
        ${cols.map(([,,f])=>`<td class="tnum">${f(c)}</td>`).join('')}</tr>`).join('')
    :(D.campaigns||[]).map(c=>`<tr><td><i class="dot" style="background:${colour[c.name]||'var(--ink3)'}"></i><b>${esc(c.name)}</b><div class="ch3sub">${esc(c.goal||'')}</div></td>
        ${cols.map(()=>'<td class="tnum">N/A</td>').join('')}</tr>`).join('')
    ||`<tr><td colspan="${cols.length+1}">No campaigns yet.</td></tr>`;
  let total='';
  if(live){
    /* Sum each column; a column stays NULL only if no campaign reported it. */
    const t={};
    ['spend','clicks','impressions','leads','purchases','revenue','link_clicks','landing_page_views','add_to_carts','checkouts','messages']
      .forEach(k=>{ const v=camps.filter(c=>c[k]!=null); t[k]=v.length?v.reduce((s,c)=>s+Number(c[k]),0):null; });
    total=`<tr class="total"><td>Total</td>${cols.map(([,,f])=>`<td class="tnum">${f(t)}</td>`).join('')}</tr>`;
  }
  return `<div class="card"><div class="cardhead"><div><h3>By campaign</h3><p class="ch3sub">${live?esc(label)+', every campaign running':'Built and ready to start'}</p></div></div>
    <div class="tscroll"><table class="tbl"><thead><tr><th>Campaign</th>${cols.map(([,h])=>`<th class="tnum">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}${total}</tbody></table></div><p class="scrollhint">Swipe the table sideways to see every column.</p></div>`;
}

/* ---------- charts (SVG, no library; spend and counts never share a scale) ---------- */
function drawAll(){
  const days=D.daily||[];
  [['ch-ov-spend','line'],['ch-meta-spend','line'],['ch-google-spend','line'],['ch-ov-leads','bar'],
   ['ch-ov-stack','stack'],['ch-meta-stack','stack'],['ch-google-stack','stack']].forEach(([id,kind])=>{

    if(!days.length){ m.innerHTML='<div class="empty-note">No daily figures yet. The chart appears once your campaigns start spending.</div>'; return; }
    if(kind==='line') lineChart(m,days,d=>Number(d.spend||0),'var(--c1)',aud,'Spend');
    else if(kind==='bar') SHOP()
      ? barChart(m,days,d=>Number(d.add_to_carts||0),'var(--c2)',num,'Add to carts')
      : barChart(m,days,d=>Number(d.leads||0),'var(--c2)',num,'Enquiries');
    else stackChart(m);
  });

/* A chart's viewBox has to match the box it is drawn into, otherwise the SVG is
   scaled to fit and sits letterboxed with dead space either side. Measure, then draw. */
function cw(mount){ const w=Math.round(mount.getBoundingClientRect().width); return Math.max(300, w||800); }
function axisDays(days,X,H){
  const step=Math.max(1,Math.floor(days.length/6)); let s='';
  days.forEach((d,i)=>{ if(i%step) return;
    s+=`<text class="axtxt" x="${X(i)}" y="${H-7}" text-anchor="middle">${new Date(d.day+'T00:00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit'})}</text>`;});
  return s;
}
function tipFor(m){ const t=document.createElement('div'); t.className='tip'; m.appendChild(t); return t; }
function lineChart(mount,days,val,colour,fmt,label){
  const W=cw(mount),H=230,P={t:12,r:14,b:24,l:50},iw=W-P.l-P.r,ih=H-P.t-P.b,N=days.length;
  const v=days.map(val), mx=Math.max(...v,1)*1.12;
  const X=i=>P.l+(N<=1?iw/2:iw*i/(N-1)), Y=n=>P.t+ih-(n/mx)*ih;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  for(let t=0;t<=4;t++){const y=Y(mx*t/4);
    svg+=`<line class="gridline" x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}"/><text class="axtxt" x="${P.l-6}" y="${y+3}" text-anchor="end">${t?fmt(mx*t/4):'0'}</text>`;}
  svg+=axisDays(days,X,H);
  const d=v.map((n,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(n).toFixed(1)}`).join('');
  svg+=`<path d="${d}L${X(N-1)} ${Y(0)}L${X(0)} ${Y(0)}Z" fill="${colour}" opacity="0.12"/>`;
  svg+=`<path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  svg+=`<line class="xh" x1="0" y1="${P.t}" x2="0" y2="${P.t+ih}" stroke="${colour}" stroke-width="1" opacity="0"/>`;
  svg+=`<circle class="hd" r="4.5" fill="${colour}" stroke="var(--s2)" stroke-width="2" opacity="0"/></svg>`;
  mount.innerHTML=svg; const tip=tipFor(mount);
  const el=mount.querySelector('svg'),xh=el.querySelector('.xh'),hd=el.querySelector('.hd');
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    let i=Math.round((px-P.l)/iw*(N-1)); i=Math.max(0,Math.min(N-1,i)); const x=X(i);
    xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.style.opacity=.5;
    hd.setAttribute('cx',x); hd.setAttribute('cy',Y(v[i])); hd.style.opacity=1;
    tip.innerHTML=`<div class="td">${new Date(days[i].day+'T00:00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'short'})}${DUMMY?' · sample':''}</div>
      <div class="tr"><span><i style="background:${colour}"></i>${label}</span><b>${fmt(v[i])}</b></div>`;
    tip.style.opacity=1;
    const tw=tip.offsetWidth; tip.style.left=Math.min(Math.max(x/W*r.width-tw/2,4),r.width-tw-4)+'px';
  });
  el.addEventListener('pointerleave',()=>{tip.style.opacity=0;xh.style.opacity=0;hd.style.opacity=0;});
}
function barChart(mount,days,val,colour,fmt,label){
  const W=cw(mount),H=230,P={t:12,r:14,b:24,l:50},iw=W-P.l-P.r,ih=H-P.t-P.b,N=days.length;
  const v=days.map(val), top=Math.max(1,Math.ceil(Math.max(...v))), mx=top*1.15;
  const bw=Math.max(4,Math.min(22,iw/N-2)), cx=i=>P.l+iw*(i+0.5)/N, Y=n=>P.t+ih-(n/mx)*ih;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  const ticks=Math.min(4,top), seen=new Set();
  for(let t=0;t<=ticks;t++){const raw=top*t/ticks,n=Math.round(raw),y=Y(raw);
    const lbl=seen.has(n)?'':fmt(n); seen.add(n);
    svg+=`<line class="gridline" x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}"/><text class="axtxt" x="${P.l-6}" y="${y+3}" text-anchor="end">${lbl}</text>`;}
  svg+=axisDays(days,cx,H);
  v.forEach((n,i)=>{ svg+=`<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${Y(n).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,(n/mx)*ih).toFixed(1)}" rx="3" fill="${colour}" opacity="${n?1:0.25}"><title>${new Date(days[i].day+'T00:00:00').toLocaleDateString('en-AU')}: ${fmt(n)}</title></rect>`;});
  svg+='</svg>'; mount.innerHTML=svg; const tip=tipFor(mount);
  const el=mount.querySelector('svg');
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    let i=Math.floor((px-P.l)/iw*N); i=Math.max(0,Math.min(N-1,i));
    tip.innerHTML=`<div class="td">${new Date(days[i].day+'T00:00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'short'})}${DUMMY?' · sample':''}</div>
      <div class="tr"><span><i style="background:${colour}"></i>${label}</span><b>${fmt(v[i])}</b></div>`;
    tip.style.opacity=1;
    const tw=tip.offsetWidth; tip.style.left=Math.min(Math.max(cx(i)/W*r.width-tw/2,4),r.width-tw-4)+'px';
  });
  el.addEventListener('pointerleave',()=>{tip.style.opacity=0;});
}
/* Daily spend split by campaign. Segments carry a 2px surface gap so adjacent
   campaigns never read as one block, and each day's total is labelled when there is room. */
function stackChart(mount){
  const {names,colour}=campSeries();
  const rows=D.daily_by_campaign||[];
  if(!rows.length||!names.length){ mount.innerHTML='<div class="empty-note">No campaign-level spend yet. This chart fills in once the campaigns start spending.</div>'; return; }
  const byDay={}; rows.forEach(r=>{ (byDay[r.day]=byDay[r.day]||{})[r.campaign]=Number(r.spend||0); });
  const days=Object.keys(byDay).sort();
  const keys=names.slice(0,5).filter(n=>days.some(d=>byDay[d][n]));
  const totals=days.map(d=>keys.reduce((s,k)=>s+(byDay[d][k]||0),0));
  const W=cw(mount),H=230,P={t:22,r:14,b:24,l:52},iw=W-P.l-P.r,ih=H-P.t-P.b,N=days.length;
  const mx=Math.max(...totals,1)*1.18, bw=Math.max(5,Math.min(26,iw/N-3));
  const cx=i=>P.l+iw*(i+0.5)/N, Y=n=>P.t+ih-(n/mx)*ih;
  const wide=mount.getBoundingClientRect().width>620, label=wide&&N<=31;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily ad spend by campaign">`;
  for(let t=0;t<=4;t++){const y=Y(mx*t/4);
    svg+=`<line class="gridline" x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}"/><text class="axtxt" x="${P.l-6}" y="${y+3}" text-anchor="end">${t?aud(mx*t/4):'0'}</text>`;}
  svg+=axisDays(days.map(d=>({day:d})),cx,H);
  days.forEach((d,i)=>{
    let acc=0;
    keys.forEach(k=>{ const v=byDay[d][k]||0; if(!v) return;
      const y0=Y(acc), y1=Y(acc+v), h=Math.max(1,y0-y1-(acc?2:0));
      svg+=`<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${colour[k]}"/>`;
      acc+=v; });
    if(label&&totals[i]) svg+=`<text class="axtxt" x="${cx(i).toFixed(1)}" y="${(Y(totals[i])-6).toFixed(1)}" text-anchor="middle" style="fill:var(--ink2)">${aud(totals[i])}</text>`;
  });
  svg+='</svg>'; mount.innerHTML=svg; const tip=tipFor(mount);
  const el=mount.querySelector('svg');
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    let i=Math.floor((px-P.l)/iw*N); i=Math.max(0,Math.min(N-1,i)); const d=days[i];
    tip.innerHTML=`<div class="td">${new Date(d+'T00:00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'short'})}${DUMMY?' · sample':''}</div>`
      + keys.map(k=>`<div class="tr"><span><i style="background:${colour[k]}"></i>${esc(k)}</span><b>${aud(byDay[d][k]||0)}</b></div>`).join('')
      + `<div class="tr" style="margin-top:5px;border-top:1px solid var(--bd);padding-top:5px"><span>Total</span><b>${aud(totals[i])}</b></div>`;
    tip.style.opacity=1;
    const tw=tip.offsetWidth; tip.style.left=Math.min(Math.max(cx(i)/W*r.width-tw/2,4),r.width-tw-4)+'px';
  });
  el.addEventListener('pointerleave',()=>{tip.style.opacity=0;});
}

/* ---------- Social: Manor on High's Social view, as built for the Savvas template
   (buff-and-brew/dashboard.js), ported to this page. Same sections, same rules:
   - followers are a standing total, so change is shown in whole followers, never a percentage
   - engagement rate, saves and shares are measured on the posts PUBLISHED that month
   - a posting slot with fewer than three posts is greyed out, never guessed
   - a figure that was never measured reads —, never 0
   Figures come from pa_client_social, which applies the same sign-in rule as the ads figures
   and reads the shared rpt_social_* tables. The tab wears Savvas colours when Savvas runs social. ---------- */
const SAVVAS={name:'Savvas Studio',
  wordmark:'https://cdn.prod.website-files.com/67afd385cf839b0956c26535/67fd04f4b993a3a0bcee54ce_SAVVAS_Wordmark_Whitenoise.webp',

let SO=null, SO_M=null;
const hasSocial=()=>!!(SO&&(SO.monthly||[]).length);
const soPartner=()=>(D.partners||[]).some(p=>/savvas/i.test(String(p)))?SAVVAS:null;
const fmt=(n,d=0)=>n==null||Number.isNaN(Number(n))?'—':Number(n).toLocaleString('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d});
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const monthOf=s=>String(s).slice(0,7);
const monthName=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-AU',{month:'long',year:'numeric'});
const sum=(a,k)=>a.reduce((t,r)=>t+(Number(r[k])||0),0);
async function loadSocial(){

const SO_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const soMon=d=>SO_MON[+String(d).slice(5,7)-1]+' '+String(d).slice(0,4);
const soAU=d=>new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric'});
const soEnd=p=>ymd(new Date(+p.slice(0,4),+p.slice(5,7),0));
const soPct=v=>v==null?'—':(v*100).toFixed(1)+'%';
const soAvg=a=>a.length?a.reduce((t,v)=>t+v,0)/a.length:null;
const soMedian=a=>{ if(!a.length) return null; const b=a.slice().sort((x,y)=>x-y),m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; };
const SO_MEL=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',weekday:'short',hour:'numeric',hourCycle:'h23'});
const soSlot=iso=>{ const p=SO_MEL.formatToParts(new Date(iso)),g=t=>(p.find(x=>x.type===t)||{}).value; return {day:g('weekday'),hour:+g('hour')}; };
const soSafeUrl=u=>{ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:'#'; }catch(e){ return '#'; } };
const soSec=t=>`<div class="so-sec">${t}</div>`;
const soDelta=(cur,prev)=>{ if(prev==null||prev===0||cur==null) return '';
  const p=(cur-prev)/Math.abs(prev)*100,f=Math.abs(p)<0.5;
  return `<div class="so-delta ${f?'flat':p>0?'up':'down'}">${f?'→':p>0?'▲':'▼'} ${Math.abs(p).toFixed(0)}% vs prev month</div>`; };
const soHero=(lbl,big,small,delta='',accent=false)=>

/* A follower count Instagram never gave us stays null, so a total is only shown when both
   platforms have one. Reach and engagement are always measured, so they sum as before. */
function soGroup(rows){
  const blank=()=>({followers:null,reach:0,engagement:0}), by={};
  rows.forEach(r=>{ const k=r.period_date;
    by[k]??={periodDate:k,month:r.period_label,ig:blank(),fb:blank()};
    by[k][r.platform==='facebook'?'fb':'ig']={followers:r.followers==null?null:+r.followers,reach:+r.reach||0,engagement:+r.engagement||0}; });
  return Object.values(by).sort((a,b)=>a.periodDate<b.periodDate?-1:1).map(m=>{
    m.t={followers:m.ig.followers!=null&&m.fb.followers!=null?m.ig.followers+m.fb.followers:null,reach:m.ig.reach+m.fb.reach,engagement:m.ig.engagement+m.fb.engagement};
    return m; });
}
function soStats(ps){
  const reels=ps.filter(p=>p.format==='REEL'),reach=sum(ps,'reach'),eng=sum(ps,'engagement');
  return {n:ps.length,reach,eng,er:reach?eng/reach:null,saves:sum(ps,'saves'),shares:sum(ps,'shares'),
    visits:ps.some(p=>p.profile_visits!=null)?sum(ps,'profile_visits'):null,
    watch:soAvg(reels.filter(r=>r.reel_avg_watch_ms!=null).map(r=>r.reel_avg_watch_ms/1000)),
    hold:soAvg(reels.filter(r=>r.reel_skip_rate!=null).map(r=>1-+r.reel_skip_rate))};
}

  let grid='',yl='';
  for(let g=0;g<=4;g++){ const yy=padT+plotH-(g/4)*plotH; grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#3A3236"/>`; yl+=`<text x="${padL-8}" y="${yy+4}" fill="#8C8C99" font-size="10" font-family="Space Mono, monospace" text-anchor="end">${kfmt(maxV*g/4)}</text>`; }
  const line=k=>rows.map((r,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(+r[k]||0).toFixed(1)).join(' ');
  const area=k=>`M${X(0).toFixed(1)} ${(padT+plotH).toFixed(1)} `+rows.map((r,i)=>'L'+X(i).toFixed(1)+' '+Y(+r[k]||0).toFixed(1)).join(' ')+` L${X(n-1).toFixed(1)} ${(padT+plotH).toFixed(1)} Z`;
  let xl='',lastM='';
  rows.forEach((r,i)=>{ const m=String(r.metric_date).slice(0,7); if(m!==lastM){ lastM=m; xl+=`<text x="${X(i).toFixed(1)}" y="${H-padB+18}" fill="#8C8C99" font-size="10" font-family="Space Mono, monospace" text-anchor="middle">${SO_MON[+m.slice(5,7)-1]}</text>`; } });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Instagram daily reach and views over time">${grid}${yl}`
    +`<path d="${area('views')}" fill="${accent}" opacity="0.13"/><path d="${area('reach')}" fill="${green}" opacity="0.10"/>`
    +`<path d="${line('views')}" fill="none" stroke="${accent}" stroke-width="2"/><path d="${line('reach')}" fill="none" stroke="${green}" stroke-width="2"/>${xl}</svg>`;
}

/* ---------- Ask: answers come from this client's own figures, via the edge function.
   The key never touches this page, and the database refuses any other client's data. ---------- */
/* Drop a square image at /dashboard/jarvis.png and it is used everywhere.
   Until then every avatar falls back to the JC monogram, so nothing ever renders broken. */
const JARVIS_PIC='jarvis.png';
let jarvisPic=null;               // null = unknown, true/false once tested
function avatar(small,badge){
  const cls='av'+(small?' sm':'');
  const face = jarvisPic===false
    ? `<span class="${cls} avmono">JC</span>`
    : `<img class="${cls}" src="${JARVIS_PIC}" alt="Jarvis, Jose's AI assistant">`;
  /* The face is a real photograph, so it says AI on it. Nobody should ever be able to
     think they were talking to a person without being told. */
  return badge ? `<span class="avwrap">${face}<span class="aibadge">AI</span></span>` : face;
}
function testJarvisPic(){ return new Promise(res=>{ const i=new Image();
  i.onload=()=>{jarvisPic=true;res(true)}; i.onerror=()=>{jarvisPic=false;res(false)}; i.src=JARVIS_PIC; }); }

/* Fallbacks only. The real list is the client's own service-scoped FAQ set. */
const SUGGEST=[ 'How are my ads going this month?','Which campaign is working best?','Which ad is performing best?',
  'Why has my cost per enquiry changed?','What have you changed recently?','What does cost per enquiry mean?' ];
let FAQS=null;
let askHistory=[], askBusy=false, lastQ='';
function askOpen(on){ $('askPanel').classList.toggle('on',on); $('askBtn').style.display=on?'none':'flex'; if(on) $('askInput').focus(); }
function aiBubble(text){ return `${avatar(true)}<div class="bubble"><span class="who">Jarvis</span>${esc(text)}</div>`; }
function askAdd(who,text){
  const d=document.createElement('div'); d.className='msg '+who;
  d.innerHTML = who==='ai' ? aiBubble(text) : esc(text);
  $('askBody').appendChild(d); $('askBody').scrollTop=$('askBody').scrollHeight; return d;
}
function askSuggest(all){
  const list = (FAQS && FAQS.length) ? (all ? FAQS : FAQS.slice(0,6)) : SUGGEST;
  document.querySelectorAll('.asksug').forEach(x=>x.remove());   // never two sets at once
  if(all) askAdd('sys','Common questions');
  const w=document.createElement('div'); w.className='asksug';
  list.forEach(q=>{ const b=document.createElement('button'); b.type='button'; b.textContent=q;
    b.addEventListener('click',()=>{ w.remove(); askSend(q); }); w.appendChild(b); });
  $('askBody').appendChild(w); $('askBody').scrollTop=$('askBody').scrollHeight;
}
async function askSend(q){
  if(askBusy||!q) return; askBusy=true; lastQ=q; $('askSend').disabled=true; $('askInput').value='';
  askAdd('me',q);
  const thinking=askAdd('ai','Reading your account...');
  try{
    const {data,error}=await sb.functions.invoke('dashboard-ask',{body:{slug:D.slug,question:q,history:askHistory,email:D.email}});
    const reply=(error? 'Something went wrong reaching the assistant. Please try again, or email jose@readytorank.com.au.' : (data&&data.reply)||'No answer came back.');
    thinking.innerHTML=aiBubble(reply);
    askHistory=[...askHistory,{role:'user',content:q},{role:'assistant',content:reply}].slice(-6);
    if(data&&data.route) askAdd('sys','Passed to '+(data.route==='jose'?'Jose':'the team'));
  }catch(e){ thinking.innerHTML=aiBubble('I could not connect just now. Please try again shortly.'); }
  $('askBody').scrollTop=$('askBody').scrollHeight; askBusy=false; $('askSend').disabled=false;
}
async function askInit(){
  await testJarvisPic();
  $('askAvatar').innerHTML=avatar(false,true); $('askBtnAvatar').innerHTML=avatar(true,true);
  $('askBtn').style.display='flex';
  let first=''; try{ const {data}=await sb.rpc('pa_viewer_first_name'); first=data||''; }catch(e){}
  try{ const {data}=await sb.rpc('pa_faq_list',{p_slug:D.slug});
       if(Array.isArray(data)&&data.length) FAQS=data.map(r=>r.question); }catch(e){}
  const hi = first? 'Hi '+first+'. ' : 'Hi. ';
  $('askAsAt').textContent = DUMMY ? 'Sample data so far' : (D.last_pull? 'Figures as at '+new Date(D.last_pull).toLocaleDateString('en-AU') : 'Your account');
  $('askNote').textContent = DUMMY
    ? 'Your campaigns have not produced reporting data yet, so Jarvis can explain how everything works but cannot report results.'
    : 'Jarvis answers from your own account figures only, updated daily. He will tell you when he does not have something rather than guess.';
  askAdd('ai', hi + (DUMMY
    ? "I'm Jarvis, Jose's AI assistant. I can answer anything about your advertising. Your campaigns have not started reporting yet, so for now I can explain how it all works and what is set up. Once the ads have run I can tell you exactly how they are going."
    : "I'm Jarvis, Jose's AI assistant. Ask me anything about your advertising and I'll answer from your own figures. If I don't have something, I'll say so rather than guess."));
  askSuggest();
}

/* A question that needs a person must never die in this chat. Jarvis routes it himself
   when he spots one, and these two buttons let the client push it across regardless. */
async function handoff(route,btn){
  const q = lastQ || $('askInput').value.trim();
  if(!q){ $('handoffOk').textContent='Ask your question first, then send it across.'; return; }
  btn.disabled=true;
  try{
    const {error}=await sb.rpc('pa_ask_escalate',{p_slug:D.slug,p_question:q,
      p_note:'Sent by the client from the dashboard chat',p_route:route});
    if(error) throw error;
    askAdd('sys','Sent to '+(route==='jose'?'Jose':'the team'));
    $('handoffOk').textContent = route==='jose'
      ? 'Jose has it and will come back to you.'
      : 'The team has it and will come back to you.';
  }catch(e){ $('handoffOk').textContent='That did not send. Please email jose@readytorank.com.au.'; }
  setTimeout(()=>{btn.disabled=false;},2500);
}
$('toJose').addEventListener('click',e=>handoff('jose',e.currentTarget));
$('showFaq').addEventListener('click',()=>askSuggest(true));
$('askBtn').addEventListener('click',()=>askOpen(true));
$('askClose').addEventListener('click',()=>askOpen(false));
$('askForm').addEventListener('submit',e=>{e.preventDefault(); askSend($('askInput').value.trim());});

let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(booted) drawAll(); },180);});
boot();
</script>
