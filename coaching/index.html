<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Coaching | Ready to Rank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#17B4F0;--blue-d:#0E8FC2;--ink:#0F0F12;--ink2:#3B4250;--mute:#6B7380;--line:#E3E7EE;--bg:#FFFFFF;--soft:#F5F8FB;--soft2:#EEF6FB;--ok:#1F9D55;--warn:#B7791F;--bad:#C53030;--yel:#FFF6CC;
  --sans:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:'Space Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--blue-d)}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
header.top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
header.top img{height:34px}
header.top .t{font-weight:800;font-size:17px}
header.top .t small{display:block;font:400 11px var(--mono);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
header.top .sp{flex:1}
header.top .who{font:12px var(--mono);color:var(--mute)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue-d)}.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wide{width:100%}
/* login */
#login{max-width:400px;margin:9vh auto;padding:32px;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(15,15,18,.06)}
#login img{height:40px;margin-bottom:18px}
#login h1{font-size:22px;margin:0 0 6px}
#login .sub{color:var(--mute);font-size:13.5px;margin:6px 0 16px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(23,180,240,.35);border-color:var(--blue)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
/* app */
#app{display:flex;min-height:calc(100vh - 63px)}
nav.progs{width:240px;flex:0 0 240px;border-right:1px solid var(--line);padding:18px 12px;background:var(--soft)}
nav.progs h6{font:700 11px var(--mono);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin:4px 10px 10px}
nav.progs button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink2)}
nav.progs button small{display:block;font:11px var(--mono);color:var(--mute)}
nav.progs button.on{background:#fff;color:var(--ink);box-shadow:inset 3px 0 0 var(--blue);font-weight:700}
main{flex:1;min-width:0;padding:22px 32px 60px}
.phead h2{font-size:26px;margin:0}
.phead .meta{font:12px var(--mono);color:var(--mute);margin-top:4px}
.phead p{color:var(--ink2);max-width:820px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;background:#fff}
.card h3{margin:0 0 4px;font-size:17px}
.card .k{font:11px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.md{color:var(--ink2)}
.md h1,.md h2,.md h3,.md h4{color:var(--ink);margin:14px 0 6px;font-size:15.5px}
.md p{margin:8px 0}.md ul,.md ol{margin:6px 0 6px 20px;padding:0}
.md table{border-collapse:collapse;margin:10px 0;font-size:13.5px}
.md td,.md th{border:1px solid var(--line);padding:5px 9px;text-align:left}
.md th{background:var(--soft)}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:1px 4px;border-radius:4px}
.tofill{background:var(--yel);border-radius:4px;padding:0 3px}
.pill{display:inline-block;font:11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--soft2);color:var(--blue-d);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:8px 0 14px}
.stat{background:var(--soft);border-radius:10px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font:11px var(--mono);color:var(--mute);text-transform:uppercase}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{font:11px var(--mono);color:var(--mute);text-transform:uppercase;text-align:right;padding:7px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.data tr.b td{font-weight:700;border-top:1px solid var(--ink)}
table.data tr.sec td{font:700 11px var(--mono);color:var(--blue-d);text-transform:uppercase;border-bottom:0;padding-top:14px}
.scroll{overflow-x:auto}
.neg{color:var(--bad)}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
/* actions */
.act{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.act .a{font-weight:600}.act .m{font:12px var(--mono);color:var(--mute)}
.act select{width:auto;padding:5px 8px}
.st-done .a{text-decoration:line-through;color:var(--mute)}
/* comments */
.cmts{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.cmts summary{cursor:pointer;font:12px var(--mono);color:var(--blue-d)}
.cmt{background:var(--soft);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}
.cmt .by{font:11px var(--mono);color:var(--mute)}
.cmtform{display:flex;gap:8px;margin-top:6px}.cmtform input{flex:1}
/* forecast inputs */
table.inp td{padding:5px 8px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
table.inp input{width:110px;padding:5px 7px;text-align:right}
table.inp tr.dec td.v{background:var(--yel)}
table.inp .src{font-size:12px;color:var(--mute);max-width:520px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:6px 12px;cursor:pointer;color:var(--mute);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.org .fn{margin-bottom:14px}.org .fn h4{margin:0 0 6px;font-size:14px}
.seat{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:0 6px 6px 0;min-width:190px;vertical-align:top}
.seat b{display:block;font-size:13.5px}.seat span{font-size:12px;color:var(--mute)}
.seat.vacant{border-style:dashed;background:var(--soft)}.seat.planned{border-style:dotted;opacity:.8}
.orgbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.treewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:16px;max-height:80vh}
.tree{transform-origin:0 0;width:max-content;margin:0 auto}
.tree ul{display:flex;justify-content:center;margin:0;padding:22px 0 0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:22px 5px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:1.5px solid #B9C3D0}
.tree li::after{right:auto;left:50%;border-left:1.5px solid #B9C3D0}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid #B9C3D0;border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before,.tree .stack::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:1.5px solid #B9C3D0}
.tree>ul>li{padding-top:0}.tree>ul>li::before,.tree>ul>li::after{display:none}
.node{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:9px;padding:7px 10px;width:160px;text-align:center;box-shadow:0 2px 6px rgba(15,15,18,.05)}
.node b{display:block;font-size:13px;line-height:1.25}.node span{display:block;font-size:11.5px;color:var(--mute);line-height:1.3;margin-top:2px}
.node .loc{font:10px var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.node.ceo{border-top-color:var(--ink);background:var(--ink);color:#fff}.node.ceo span{color:#C9D2DE}
.node.vacant{border-style:dashed;border-top:3px dashed var(--warn);background:#FFFCF2}.node.planned{border-style:dotted;border-top:3px dotted var(--mute);opacity:.85}
.node.starting{border-top-color:var(--ok)}
.stack{position:relative;padding-top:22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stack .node{width:150px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:11px var(--mono);color:var(--mute);text-transform:uppercase}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
@media (max-width:820px){#app{flex-direction:column}nav.progs{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px}nav.progs h6{display:none}nav.progs button{white-space:nowrap;width:auto}main{padding:16px}header.top{padding:12px 16px}}
</style>
</head>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n,dp){if(n==null||isNaN(n))return "";var neg=n<0,a=Math.abs(n);var s="$"+a.toLocaleString("en-AU",{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0});return neg?"("+s+")":s}

function dmy(d){if(!d)return "";var p=String(d).slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function inl(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>")
     .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
     .replace(/(⚠ To fill \(Jose\):[^<]*)/g,'<span class="tofill">$1</span>');
  return s;
}
function md(src){
  var L=String(src||"").replace(/\r/g,"").split("\n"),out=[],i=0;
  while(i<L.length){
    var l=L[i];
    if(/^\s*$/.test(l)){i++;continue}
    var h=l.match(/^(#{1,4})\s+(.*)$/); if(h){out.push("<h"+(h[1].length+1)+">"+inl(h[2])+"</h"+(h[1].length+1)+">");i++;continue}
    if(/^\s*\|/.test(l)){var rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
      var t="<table>";rows.forEach(function(r,ri){if(/^\s*\|[\s:|-]+\|\s*$/.test(r))return;var c=r.trim().replace(/^\||\|$/g,"").split("|");var tag=ri===0?"th":"td";t+="<tr>"+c.map(function(x){return "<"+tag+">"+inl(x.trim())+"</"+tag+">"}).join("")+"</tr>"});out.push(t+"</table>");continue}
    if(/^\s*([-*•]|\d+\.)\s+/.test(l)){var ol=/^\s*\d+\./.test(l),items=[];while(i<L.length&&/^\s*([-*•]|\d+\.)\s+/.test(L[i])){items.push(L[i].replace(/^\s*([-*•]|\d+\.)\s+/,""));i++}
      out.push((ol?"<ol>":"<ul>")+items.map(function(x){return "<li>"+inl(x)+"</li>"}).join("")+(ol?"</ol>":"</ul>"));continue}
    var p=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,4})\s/.test(L[i])&&!/^\s*\|/.test(L[i])&&!/^\s*([-*•]|\d+\.)\s+/.test(L[i])){p.push(L[i]);i++}
    out.push("<p>"+inl(p.join(" "))+"</p>");
  }
  return out.join("");
}

function fcInputs(){return snap("forecast_inputs").data}
function compute(sc){
  var D=fcInputs(),v={};D.inputs.forEach(function(i){v[i.key]=Number(i[sc])});
  var y=+D.start_month.slice(0,4),m0=+D.start_month.slice(5,7)-1,mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var rows=[],mrr=v.open_mrr,cl=v.open_clients,cum=0;
  for(var k=1;k<=D.months;k++){
    var mi=(m0+k-1)%12,yy=y+Math.floor((m0+k-1)/12);
    var r={label:mn[mi]+" "+String(yy).slice(2),open:mrr};
    r.churn=-mrr*v.churn;r.newc=v.new_clients*v.new_value;r.up=v.upsell;r.pc=(k===v.pc_month?v.pc_amt:0);
    r.close=r.open+r.churn+r.newc+r.up+r.pc;cl=cl*(1-v.churn)+v.new_clients;r.clients=cl;
    r.ret=r.close;r.build=v.builds*v.build_value;r.other=v.other_inc;r.inc=r.ret+r.build+r.other;
    r.cogs=-r.inc*v.cogs_pct;r.gp=r.inc+r.cogs;
    r.opex=-v.opex;r.mk=-v.mktg;r.h1=-v.hire1;r.h2=(k>=v.hire2_month?-v.hire2:0);r.co=(k>=v.coach_from&&k<=v.coach_to?-v.coach:0);
    r.net=r.gp+r.opex+r.mk+r.h1+r.h2+r.co;r.draw=-v.drawings;r.after=r.net+r.draw;r.head=r.after-r.inc*v.target;cum+=r.head;r.cum=cum;
    rows.push(r);mrr=r.close;
  }
  return rows;
}

  Object.keys(kids).forEach(function(k){kids[k].sort(function(a,b){return (a.sort||0)-(b.sort||0)})});
  function node(s){var st=s.status==="vacant"?"vacant":s.status==="planned"?"planned":s.status==="starting"?"starting":"";
    return '<div class="node '+st+(s.reports_to?"":" ceo")+'"><b>'+esc(s.person_name||(s.status==="planned"?"Planned":"Vacant"))+'</b><span>'+esc(s.role_title)+'</span>'+
      ((s.location||s.status==="starting")?'<div class="loc">'+esc([s.location,s.status==="starting"?"Starting":""].filter(Boolean).join(" · "))+'</div>':'')+'</div>'}
  function li(s){var c=kids[s.seat_id]||[];
    if(!c.length)return '<li>'+node(s)+'</li>';
    var allLeaves=c.every(function(x){return !(kids[x.seat_id]||[]).length});
    if(allLeaves&&c.length>=3)return '<li>'+node(s)+'<div class="stack">'+c.map(node).join("")+'</div></li>';
    return '<li>'+node(s)+'<ul>'+c.map(li).join("")+'</ul></li>'}
  return '<div class="treewrap" id="treewrap"><div class="tree" id="tree"><ul>'+roots.map(li).join("")+'</ul></div></div><p class="note">Lines show who reports to whom. Where one person holds two seats (for example Jhen, Jigar) they appear in both.</p>';
}
function fitTree(){var w=$("treewrap"),t=$("tree");if(!w||!t)return;t.style.transform="";w.style.height="";
  if(!ORGFIT)return;var avail=w.clientWidth-32,full=t.scrollWidth;var k=Math.min(1,avail/full);
  t.style.transform="scale("+k+")";w.style.height=(t.offsetHeight*k+34)+"px";w.style.overflow="hidden"}
function wireOrg(){wireComments();
  Array.prototype.forEach.call(document.querySelectorAll("[data-ov]"),function(b){b.onclick=function(){ORGV=b.dataset.ov;render()}});
  Array.prototype.forEach.call(document.querySelectorAll("[data-fit]"),function(b){b.onclick=function(){ORGFIT=b.dataset.fit==="1";render()}});
  if(ORGV==="tree"){fitTree();if(!ORGFIT)$("treewrap").style.overflow="auto"}}
window.addEventListener("resize",function(){if(TAB==="org"&&ORGV==="tree")fitTree()});

  var h='<div class="card"><h3>About this program</h3><div class="md">'+md(p.description||"")+'</div>'+
    '<table class="data" style="margin-top:10px"><tr><td>Provider</td><td>'+esc(p.provider||"")+'</td></tr><tr><td>Started</td><td>'+dmy(p.started_on)+'</td></tr><tr><td>Runs to</td><td>'+dmy(p.ends_on)+'</td></tr>'+
    (p.url?'<tr><td>Link</td><td><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.url)+'</a></td></tr>':'')+(p.cost_note?'<tr><td>Cost</td><td style="text-align:left">'+esc(p.cost_note)+'</td></tr>':'')+'</table>';
  if(IS_OWNER){h+='<details style="margin-top:14px"><summary class="k" style="cursor:pointer">Edit details</summary><div class="grid2"><div><label>Name</label><input type="text" id="pName" value="'+esc(p.name)+'"></div><div><label>Provider</label><input type="text" id="pProv" value="'+esc(p.provider||"")+'"></div>'+
    '<div><label>Started</label><input type="date" id="pStart" value="'+esc(p.started_on||"")+'"></div><div><label>Runs to</label><input type="date" id="pEnd" value="'+esc(p.ends_on||"")+'"></div><div><label>Link</label><input type="url" id="pUrl" value="'+esc(p.url||"")+'"></div><div><label>Cost</label><input type="text" id="pCost" value="'+esc(p.cost_note||"")+'"></div></div>'+
    '<label>Description</label><textarea id="pDesc">'+esc(p.description||"")+'</textarea><div class="row" style="margin-top:10px"><button class="btn" id="pSave" type="button">Save details</button><span class="note" id="pMsg"></span></div></details>';}
  h+='</div>';
  $("tab").innerHTML=h;
  if(IS_OWNER)$("pSave").onclick=async function(){var row={name:$("pName").value.trim(),provider:$("pProv").value.trim()||null,started_on:$("pStart").value||null,ends_on:$("pEnd").value||null,url:$("pUrl").value.trim()||null,cost_note:$("pCost").value.trim()||null,description:$("pDesc").value};
    var r=await sb.from("coaching_programs").update(row).eq("slug",CUR);if(r.error){$("pMsg").textContent=r.error.message;return}Object.assign(p,row);renderNav();render()};
}

if(new URLSearchParams(location.search).get("embed")){document.querySelector("header.top").classList.add("hide");document.documentElement.style.setProperty("--embed","1");var st=document.createElement("style");st.textContent="#app{min-height:100vh}";document.head.appendChild(st)}
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")location.reload()});
boot();
})();
